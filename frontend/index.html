<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Management</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; background-color: #f4f4f9; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { padding: 10px; margin: 5px; width: 90%; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        button { padding: 10px 15px; margin: 5px; font-size: 16px; border-radius: 5px; border: none; cursor: pointer; color: white; }
        .btn-save { background-color: #3128a7; }
        .btn-edit { background-color: #ffc107; color: black; padding: 5px 10px; font-size: 14px; }
        .btn-delete { background-color: #dc3545; padding: 5px 10px; font-size: 14px; }
        .employee-card { border: 1px solid #ddd; padding: 10px; margin-top: 10px; border-radius: 5px; text-align: left; background: #fafafa; }
    </style>
</head>
<body>

<div class="container">
    <h2>Employee Management Systemsssss</h2>
    
   
    <input type="hidden" id="empId">
    <input type="text" id="empName" placeholder="Employee Name">
    <input type="text" id="empPosition" placeholder="Job Position">
    <input type="text" id="empDepartment" placeholder="Department">
    <br>
    <button class="btn-save" onclick="saveEmployee()">Save Employee</button>
    <button onclick="clearForm()" style="background-color: #6c757d;">Clear</button>

    <hr>
    
    <h3>Employees List</h3>
    <div id="employeesList"></div>
</div>

<script>
    const apiUrl = 'http://localhost:8081/api/employees';

    // 1. عرض الموظفين
    async function fetchEmployees() {
        const response = await fetch(apiUrl);
        const employees = await response.json();
        const list = document.getElementById('employeesList');
        list.innerHTML = '';
        employees.forEach(emp => {
            list.innerHTML += `
                <div class="employee-card">
                    <strong>${emp.name}</strong> - ${emp.position} (${emp.department})
                    <div style="margin-top: 10px;">
                        <button class="btn-edit" onclick="editEmployee(${emp.id}, '${emp.name}', '${emp.position}', '${emp.department}')">Edit</button>
                        <button class="btn-delete" onclick="deleteEmployee(${emp.id})">Delete</button>
                    </div>
                </div>
            `;
        });
    }

    // 2. الحفظ (سواء إضافة أو تعديل)
    async function saveEmployee() {
        const id = document.getElementById('empId').value;
        const name = document.getElementById('empName').value;
        const position = document.getElementById('empPosition').value;
        const department = document.getElementById('empDepartment').value;

        if (!name || !position || !department) {
            alert("Please fill all fields!");
            return;
        }

        const employeeData = { name, position, department };

        if (id) {
            // لو فيه ID يبقى ده تعديل (PUT)
            await fetch(`${apiUrl}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(employeeData)
            });
        } else {
            // لو مفيش ID يبقى إضافة جديدة (POST)
            await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(employeeData)
            });
        }

        clearForm();
        fetchEmployees();
    }

    // 3. تجهيز الفورم للتعديل
    function editEmployee(id, name, position, department) {
        document.getElementById('empId').value = id;
        document.getElementById('empName').value = name;
        document.getElementById('empPosition').value = position;
        document.getElementById('empDepartment').value = department;
    }

    // 4. الحذف
    async function deleteEmployee(id) {
        if (confirm("Are you sure you want to delete this employee?")) {
            await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
            fetchEmployees();
        }
    }

    // تنظيف الفورم
    function clearForm() {
        document.getElementById('empId').value = '';
        document.getElementById('empName').value = '';
        document.getElementById('empPosition').value = '';
        document.getElementById('empDepartment').value = '';
    }

    // تشغيل جلب البيانات أول ما الصفحة تفتح
    fetchEmployees();
</script>

</body>
</html>
